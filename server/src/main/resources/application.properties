spring.application.name=ledger-pay
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.flyway.validate-migration-naming=true

ledger.accounts.provider-clearing-id=a8787354-3986-4d7c-890c-a3f35a5895b8
ledger.accounts.merchant-payable-id=00bea332-5c07-4251-96cd-c8776587f370

bachs.webhook.secret=${BACHS_WEBHOOK_SECRET:}

bachs.api.base-url=https://sandbox-api.bachs.io/v1
bachs.api.key=${BACHS_API_KEY}

paystack.api.base-url=https://api.paystack.co
paystack.api.secret-key=${PAYSTACK_SECRET_KEY}

outbox.poll-interval-ms=1000

paystack.secret-key=${PAYSTACK_SECRET_KEY}

payment.expiry.duration-minutes=15
payment.expiry.grace-period-minutes=2
payment.expiry.scheduler-delay=30000

spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Consumer
spring.kafka.consumer.group-id=webhook-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Trusted packages
spring.kafka.consumer.properties.spring.json.trusted.packages=com.abolore.ledger_pay.webhooks.entity
logging.level.org.springframework.kafka=DEBUG
